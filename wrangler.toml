name = "nodewarden"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = false

[triggers]
crons = [ "*/5 * * * *" ]

[[d1_databases]]
binding = "DB"
database_name = "nodewarden-db"

[[durable_objects.bindings]]
name = "NOTIFICATIONS_HUB"
class_name = "NotificationsHub"

# Cloudflare Email Sending (Email 2FA default channel).
# Requires Workers Paid plan + verified sending domain on the account.
# Set MFA_EMAIL_FROM to the verified sender address in .dev.vars / Worker secrets.
# remote=true lets wrangler dev use the real Cloudflare Email Sending service.
[[send_email]]
name = "EMAIL"
remote = true

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "nodewarden-attachments"

[[migrations]]
tag = "v1-notifications-hub"
new_sqlite_classes = [ "NotificationsHub" ]
